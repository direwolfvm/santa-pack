# Runs on every pull request and on pushes to main. It uses no secrets and
# only needs read access.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Firebase API and app (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator runs on the JVM.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Uses a demo- project id, so the emulators need no credentials.
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      # The Firebase frontend (app/) played end to end against the emulators.
      - run: npm run test:e2e:firebase
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-firebase-output
          path: output/playwright-firebase
          retention-days: 7

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The suite stubs the Supabase SDK in the browser, so it needs no secrets.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-output
          path: output/playwright
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t santa-pack:ci .
      # Start the image in both modes and check each serves the right frontend.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name supabase-mode -p 8081:8080 \
            -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_ANON_KEY=ci santa-pack:ci
          docker run -d --name firebase-mode -p 8082:8080 \
            -e BACKEND=firebase -e GOOGLE_CLOUD_PROJECT=demo-ci -e FIRESTORE_DATABASE=santa-pack \
            -e FIREBASE_TENANT_ID=ci -e FIREBASE_API_KEY=ci -e FIREBASE_AUTH_DOMAIN=localhost \
            -e APP_BASE_URL=http://localhost:8082 santa-pack:ci
          for port in 8081 8082; do
            for _ in $(seq 1 20); do curl -fs "http://localhost:$port/api/health" && break; sleep 1; done
          done
          test "$(docker exec supabase-mode whoami)" = node
          curl -fs http://localhost:8081/login.html | grep -q 'supabase-js'
          curl -fs http://localhost:8082/login.html | grep -q 'type="module"'
          curl -fs http://localhost:8082/api/config | grep -q '"tenantId":"ci"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/api/me)" = 401

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the pull request's commits through the API, which
    # needs read access to pull requests on top of the workflow default.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  # Merges a Dependabot PR once every job above has passed, when the update is patch or
  # minor (for a grouped PR, its largest bump) or only touches GitHub Actions. Majors and
  # anything else wait for triage. See playbooks/dependabot.md in direwolfvm/operator.
  # A merge made with GITHUB_TOKEN does not start other workflows, so no deploy runs for it.
  dependabot-automerge:
    name: Dependabot auto-merge
    needs: [checks, integration, e2e, dependency-review, docker, secret-scan]
    # always() lets this run when a job above was skipped (for example dependency
    # review on a private repo); any failure or cancellation still stops it.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge patch, minor and Actions updates
        if: >-
          steps.meta.outputs.package-ecosystem == 'github_actions' ||
          steps.meta.outputs.package-ecosystem == 'github-actions' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
