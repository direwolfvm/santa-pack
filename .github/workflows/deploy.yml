# Deploys main to Cloud Run through cloudbuild.yaml (the rosemont-club and
# framblywish pattern; operator playbooks/ci-cd-and-deployment.md).
#
# Authentication is keyless: GitHub issues an OIDC token for this run, and
# Workload Identity Federation (pool "github", provider "santa-pack", which
# only trusts direwolfvm/santa-pack) exchanges it for short-lived credentials
# of santa-pack-deployer. The "production" environment only allows main, so a
# pull request can never deploy. No cloud keys are stored in GitHub.
#
# The job is skipped until the repository variable DEPLOY_ENABLED is "true".
# That is switched on at the cutover from Supabase, when the old Cloud Build
# trigger (which deploys the Supabase app on every push) is disabled.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: hopeful-machine-466912-t2
  GCP_REGION: us-east4
  SERVICE: santa-pack
  WORKLOAD_IDENTITY_PROVIDER: projects/983969754780/locations/global/workloadIdentityPools/github/providers/santa-pack
  DEPLOYER_SERVICE_ACCOUNT: santa-pack-deployer@hopeful-machine-466912-t2.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build and deploy to Cloud Run
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://santapack.me
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A last gate before shipping, in case a merge bypassed the CI checks.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The staging directory is given explicitly. Without it, gcloud verifies
      # the default bucket by listing every bucket in the project, which the
      # deployer is deliberately not allowed to do.
      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --project "$GCP_PROJECT" \
            --gcs-source-staging-dir "gs://${GCP_PROJECT}_cloudbuild/source" \
            --quiet

      - name: Verify the live service
        run: |
          revision=$(gcloud run services describe "$SERVICE" \
            --region "$GCP_REGION" --project "$GCP_PROJECT" \
            --format 'value(status.latestReadyRevisionName)')
          echo "Serving revision: $revision"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error https://santapack.me/api/health \
              && curl --fail --silent https://santapack.me/api/config | grep -q '"tenantId"'; then
              echo
              echo "Health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after deploy." >&2
          exit 1
