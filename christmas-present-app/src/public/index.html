<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santa Pack</title>
  <link rel="icon" href="santa-hat.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="layout.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="snow.js" defer></script>
</head>
<body>
  <header id="nav"></header>
  <h1>Your holiday households</h1>
  <p class="intro">Choose a family to plan a round, add secret gifts, or check how close everyone is to the big reveal.</p>
  <div class="section-heading"><h2>Your families</h2><p id="familyCount"></p></div>
  <div id="familiesContainer">Loading...</div>
  <div id="joinFamilySection" data-card-footer><div><strong>Missing a family?</strong><br><span>Ask to join an existing household.</span></div><button id="joinFamilyBtn">Find my family</button></div>

  <div id="createFamilySection">
    <h2>Start a new family</h2>
    <form id="familyForm">
      <label for="familyName">Family name</label>
      <input type="text" id="familyName" placeholder="The McCallisters" autocomplete="off" required />
      <button type="submit">Create family</button>
    </form>
  </div>

  <script>
      async function fetchFamilies() {
        const { data: sessionData } = await supabaseClient.auth.getSession();
        if (!sessionData.session) return [];
        const userId = sessionData.session.user.id;
        const { data, error } = await supabaseClient
          .from('person')
          .select('family!person_family_fkey(id, name)')
          .eq('user_profile', userId);
        if (error) {
          console.error(error);
          return [];
        }
        const families = (data || []).map(p => p.family)
          .filter((f, i, arr) => arr.findIndex(x => x.id === f.id) === i);
        return families;
      }

    async function loadFamilies() {
      const families = await fetchFamilies();
      const container = document.getElementById('familiesContainer');

      container.innerHTML = '';

      document.getElementById('familyCount').textContent = `${families.length} ${families.length === 1 ? 'family' : 'families'}`;
      if (families.length === 0) {
        container.className = 'empty-state';
        container.innerHTML = '<strong>Your list is still blank.</strong><br>Join a family below, or ask an administrator to create one.';
        return;
      }

      container.className = 'family-grid';

      for (const f of families) {
        const card = document.createElement('article');
        card.className = 'family-card';
        const [rounds, people] = await Promise.all([
          fetch(`/api/families/${f.id}/gift-rounds`).then(r => r.json()),
          fetch(`/api/families/${f.id}/people`).then(r => r.json())
        ]);
        const title = document.createElement('h3');
        title.textContent = f.name;
        const meta = document.createElement('div');
        meta.className = 'family-card__meta';
        meta.innerHTML = `<span><strong>${people.length}</strong> merry makers</span><span><strong>${rounds.length}</strong> gift ${rounds.length === 1 ? 'round' : 'rounds'}</span>`;
        const actions = document.createElement('div');
        actions.className = 'family-card__actions';
        const btn = document.createElement('button');
        btn.textContent = 'Open family →';
        btn.addEventListener('click', () => {
          window.location.href = `giftRounds.html?familyId=${f.id}&familyName=${encodeURIComponent(f.name)}`;
        });
        actions.appendChild(btn);
        card.append(title, meta, actions);
        container.appendChild(card);
      }
    }


    (async () => {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData.session) {
        window.location.href = 'login.html';
        return;
      }
      const token = sessionData.session.access_token;
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', sessionData.session.user.id)
        .maybeSingle();
      const isAdmin = profile && profile.role === 'admin';
      const createSection = document.getElementById('createFamilySection');
      if (isAdmin) {
        document.getElementById('familyForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('familyName').value;
          await fetch('/api/families', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ name })
          });
          document.getElementById('familyName').value = '';
          loadFamilies();
        });
      } else {
        createSection.style.display = 'none';
      }

      document.getElementById('joinFamilyBtn').addEventListener('click', () => {
        window.location.href = 'createPerson.html';
      });

      loadFamilies();
    })();
  </script>
</body>
</html>
