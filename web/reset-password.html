<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password · Santa Pack</title>
  <link rel="icon" href="santa-hat.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="api.js"></script>
  <script src="layout.js" defer></script>
  <script src="reset-password.js" defer></script>
</head>
<body class="login-page reset-page">
  <h1>Reset your password</h1>
  <p id="recoveryInstructions" class="intro">Checking your recovery link…</p>
  <form id="resetPasswordForm" hidden>
    <label for="newPassword">New password</label>
    <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
    <label for="confirmPassword">Confirm new password</label>
    <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
    <button type="submit">Save new password</button>
  </form>
  <p id="passwordStatus" class="form-status" role="status" aria-live="polite"></p>
  <p><a href="login.html">Return to sign in</a></p>
</body>
</html>
