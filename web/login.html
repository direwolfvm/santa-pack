<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Santa Pack</title>
  <link rel="icon" href="santa-hat.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="api.js"></script>
  <script src="layout.js" defer></script>
  <script src="login.js" defer></script>
</head>
<body class="login-page">
  <h1>Santa Pack</h1>
  <h2>Welcome back</h2>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required />
    <button type="submit">Unwrap my exchange</button>
  </form>
  <details class="auth-recovery">
    <summary>Forgot your password?</summary>
    <form id="forgotPasswordForm">
      <label for="resetEmail">Account email</label>
      <input type="email" id="resetEmail" autocomplete="email" placeholder="you@example.com" required />
      <button type="submit" class="secondary">Email me a reset link</button>
    </form>
    <p id="resetStatus" class="form-status" role="status" aria-live="polite"></p>
  </details>
  <div class="auth-divider">New around here?</div>
  <h2>Create an account</h2>
  <form id="signupForm">
    <label for="signupEmail">Email</label>
    <input type="email" id="signupEmail" autocomplete="email" placeholder="you@example.com" required />
    <label for="signupPassword">Password</label>
    <input type="password" id="signupPassword" autocomplete="new-password" minlength="8" required />
    <button type="submit">Join the nice list</button>
  </form>
</body>
</html>
